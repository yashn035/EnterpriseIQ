<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EnterpriseIQ Test Harness</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; max-width: 600px; margin: auto; }
    input[type="text"] { width: 100%; padding: 0.5rem; font-size: 1rem; margin-bottom: 0.5rem; }
    button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
    #result { margin-top: 1rem; padding: 1rem; border: 1px solid #ccc; border-radius: 4px; min-height: 80px; }
    .error { color: #dc2626; font-weight: bold; }
    .citation { font-weight: bold; color: #2563eb; display: inline-block; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h1>EnterpriseIQ Policy Assistant Harness</h1>
  <label for="question-input">Ask a policy question:</label>
  <input type="text" id="question-input" placeholder="Ask a question about enterprise policies..." />
  <button id="submit-btn">Submit</button>

  <div id="result" aria-live="polite">
    <div id="answer-text">Ready for question.</div>
    <div id="sources-container"></div>
  </div>

  <script>
    const submitBtn = document.getElementById('submit-btn');
    const questionInput = document.getElementById('question-input');
    const answerText = document.getElementById('answer-text');
    const sourcesContainer = document.getElementById('sources-container');

    submitBtn.addEventListener('click', async () => {
      const question = questionInput.value.trim();
      if (!question) return;

      answerText.className = '';
      answerText.textContent = 'Searching knowledge base & generating cited response...';
      sourcesContainer.innerHTML = '';

      try {
        const response = await fetch('http://127.0.0.1:8000/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        });

        if (!response.ok) {
          throw new Error(`API Error (${response.status}): ${response.statusText}`);
        }

        const data = await response.json();
        answerText.textContent = data.answer;
        if (data.sources && data.sources.length > 0) {
          sourcesContainer.innerHTML = data.sources.map(s => `<span class="citation">[Source: ${s}]</span>`).join(' ');
        }
      } catch (err) {
        answerText.className = 'error';
        answerText.textContent = `Connection error: ${err.message}`;
      }
    });

    questionInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitBtn.click();
    });
  </script>
</body>
</html>
